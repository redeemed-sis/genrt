name = "smp-boot"
suite = "smp-boot"
supervisor = "kernel"
profile = "debug"
log_level = "info"
kernel_features = ["qemu-test-smp-boot"]
cpu_count = 4
init = "kernel-contract"
timeout_secs = 45
step_timeout_secs = 15

[[steps]]
action = "expect_case"
producer = "kernel"
subject = "per-cpu-scheduler-state"

[[steps]]
action = "expect_case"
producer = "kernel"
subject = "parallel-pinned-workers"

[[steps]]
action = "expect_case"
producer = "kernel"
subject = "cpu1-timer-round-robin"

[[steps]]
action = "expect_case"
producer = "kernel"
subject = "late-remote-ready"

[[steps]]
action = "expect_case"
producer = "kernel"
subject = "per-cpu-timer-irqs"
