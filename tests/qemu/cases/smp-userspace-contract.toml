name = "smp-userspace-contract"
suite = "smp-userspace-contract"
supervisor = "smp-api-supervisor"
profile = "debug"
log_level = "info"
cpu_count = 4
init = "smp-userspace-contract"
timeout_secs = 60
step_timeout_secs = 20

[[steps]]
action = "expect_case"
producer = "smp-api-supervisor"
subject = "explicit-placement"

[[steps]]
action = "expect_case"
producer = "smp-api-supervisor"
subject = "one-shot-placement"

[[steps]]
action = "expect_case"
producer = "smp-api-supervisor"
subject = "override-placement"

[[steps]]
action = "expect_case"
producer = "smp-api-supervisor"
subject = "reset-placement"

[[steps]]
action = "expect_case"
producer = "smp-api-supervisor"
subject = "failed-fork-preserves-placement"

[[steps]]
action = "expect_case"
producer = "smp-api-supervisor"
subject = "remote-exec"

[[steps]]
action = "expect_case"
producer = "smp-api-supervisor"
subject = "exec-preserves-affinity"

[[steps]]
action = "expect_case"
producer = "smp-api-supervisor"
subject = "remote-fault-reap"

[[steps]]
action = "expect_case"
producer = "smp-api-supervisor"
subject = "affinity-validation"

[[steps]]
action = "expect_case"
producer = "smp-api-supervisor"
subject = "taskset-placement"
