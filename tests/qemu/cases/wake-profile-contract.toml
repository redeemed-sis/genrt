subject = "profile-focused-loss"
[[steps]]
action = "expect_case"
producer = "profile-supervisor"
subject = "profile-generic-rr"
[[steps]]
action = "expect_case"
producer = "profile-supervisor"
subject = "profile-generic-exit"
[[steps]]
action = "expect_case"
producer = "profile-supervisor"
subject = "profile-generic-block"
[[steps]]
action = "expect_case"
producer = "profile-supervisor"
subject = "profile-chunks-owner"
[[steps]]
action = "expect_case"
producer = "profile-supervisor"
subject = "profile-fault-cleanup"
[[steps]]
action = "expect_case"
producer = "profile-supervisor"
